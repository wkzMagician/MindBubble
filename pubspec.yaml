name: mind_bubble
description: A calm desktop concept reminder application.
publish_to: none
version: 0.4.1+6

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  # dartloom:dependencies:start
  dartloom_autostart: ^0.2.0
  dartloom_autostart_launch_at_startup: ^0.1.0
  dartloom_runtime: ^0.1.0
  dartloom_settings: ^0.2.0
  dartloom_settings_secure_storage: ^0.1.0
  dartloom_settings_shared_preferences: ^0.1.0
  dartloom_storage: ^0.2.0
  dartloom_storage_file: ^0.1.0
  dartloom_storage_json_file: ^0.1.0
  dartloom_sync: ^0.3.0
  dartloom_sync_etag: ^0.2.0
  dartloom_sync_flutter: ^0.1.0
  dartloom_sync_storage: ^0.1.0
  dartloom_sync_webdav: ^0.2.0
  dartloom_sync_workmanager: ^0.1.0
  # dartloom:dependencies:end
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  csv: ^6.0.0
  crypto: ^3.0.6
  excel: ^4.0.6
  file_picker: ^10.3.3
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^2.6.1
  http: ^1.6.0
  intl: any
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite_common_ffi: ^2.3.4+4
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  image_path: assets/icon/mind_bubble.png
  android: true
  ios: false
  windows:
    generate: true
  macos:
    generate: true
  linux:
    generate: true

