schema_version: 5

app:
  name: "mind_bubble"
  package_name: "mind-bubble"
  organization: "dev.mindbubble"
  description: "Calm cross-platform concept reminder application"

platforms:
  android: true
  ios: false
  windows: true
  macos: true
  linux: true
  web: false

capabilities:
  settings:
    instances:
      default:
        implementation: "shared_preferences"
      sync_secrets:
        implementation: "secure_storage"
  storage:
    instances:
      markdown:
        implementation: "app_file_replica"
        factory: "createMarkdownReplicaStore"
  autostart:
    instances:
      default:
        implementation: "launch_at_startup"
        platforms:
          - "windows"
          - "macos"
          - "linux"
  sync:
    instances:
      default:
        implementation: "etag"
        replica: "storage.markdown"
        conflict:
          strategy: "preserve"
          merge_factory: "createMindBubbleMergePolicy"
        backend:
          implementation: "webdav"
          options:
            root_path: "MindBubble/bubbles"
            connect_timeout: "10s"
            request_timeout: "30s"
            max_parallel_requests: 4
            create_missing_collections: true
            hierarchical: false
            probe_depth_infinity: false
            listing_limit_hint: 750
        policy:
          mode: "automatic"
          triggers:
            startup: true
            resume: true
            connectivity_restored: true
            local_write:
              enabled: true
              debounce: "2s"
              max_delay: "10s"
          discovery:
            remote_changes: "auto"
            poll_interval: "5m"
            safety_reconcile_interval: "15m"
          execution:
            timeout: "2m"
            busy_behavior: "coalesce_then_rerun"
            max_parallel_transfers: 4
            max_object_size: "20mb"
          retry:
            strategy: "exponential"
            initial_delay: "5s"
            fixed_delay: "30s"
            sequence: ["5s", "30s", "2m", "10m"]
            multiplier: 3
            max_delay: "10m"
            jitter: "20%"
            max_attempts: 0
          conflicts:
            strategy: "merge"
            delete_vs_update: "conflict"
          state:
            base_payload: "always"
            tombstone_retention: "30d"
          profiles:
            sync_on_activate: true
            existing_data: "attach_to_default"

sources:
  capabilities: github

release:
  github: true
